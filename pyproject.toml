[project]
name = "artikel-mcp"
version = "0.1.0"
description = "MCP server for article workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mcp[cli]>=2.2.0"]

[project.scripts]
artikel-mcp = "artikel_mcp.server:main"

[dependency-groups]
dev = ["ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artikel_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]